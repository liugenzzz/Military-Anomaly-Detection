# 军事异常检测本体定义 v0.2
#
# v0.2 变更(决策见 docs/08_task_types.md):
#   - 从 10 类收敛到 4 类异常 + 正常, 每类目标 25,000 条 QA
#   - 兵力集结与人员聚集合并为「异常聚集」, 保留 subtype 子标签
#   - 装备集结新增 require_any 军事目标约束: 纯民用车辆密集聚集不算异常,
#     而是标为 hard_negative 困难负样本(避免把停车场训成装甲集群)
#   - 人员聚集不设军事身份要求: 航拍视角分辨不出军装, 该约束不可实现
#   - 停用的类别保留在文件末尾(enabled: false), 便于日后一行恢复
#   - v0.5.0: 停用越界移动(单帧不可判 + 虚拟边界靠文字注入, 是在教模型编);
#     启用车队机动(补上间距均匀/车型一致/细长三条判据后才分得开车流);
#     新增灾害现场(把原先被整个排除的 ERA 洪水/滑坡/震后/事故单列成类)。
#   - v0.4.0: 每条规则加 relax 档。产量够的类别照严格阈值走(多的筛精),
#     产量不够的类别才启用放宽档补量(少的放宽), 且补出来的事件带 relaxed
#     标记, 下游答案措辞随之变软 —— 放宽的是召回, 不是结论的确定性。
#   - v0.2.1: 军用/民用目标分开命名(military-plane vs civil-plane),
#     民用机场机群与民用港口因此成为困难负样本而非误标为集结

version: "0.5.4"
box_scale: 1000                 # grounding 坐标归一化上限, Qwen-VL 系列用 1000
negative_ratio_target: 0.30     # normal 样本占比下限
qa_per_anomaly_target: 25000    # 每个异常类的 QA 条数目标

# 各数据源的抽帧间隔。默认 30 对 DroneCrowd 与 VisDrone-MOT 太稀
# (24960 帧只取 832), 按配额反推后下调; 近重复由 screen.py 的闸3 兜底。
stride:
  DroneCrowd: 8
  VisDrone2019-MOT: 8
  Drone-Anomaly: 10

classes:
  - id: normal
    zh: 正常
    enabled: true
    cues: ["无成规模目标聚集", "无烟火", "无越界行为"]

  - id: massing
    zh: 异常聚集
    enabled: true
    cues: ["目标密集成簇", "规则排列/列阵", "开阔地带集中"]
    subtypes:
      # 人员: 不要求军事身份 —— 航拍视角无法分辨军装与便装,
      # 且禁区周边大规模人员聚集本身即为需上报的异常
      - name: personnel
        zh: 人员聚集
        rule:
          kind: density_cluster
          target_classes: ["person", "pedestrian", "people", "soldier", "head"]
          # 城市街景里的人不算集结。VisDrone 的图里动辄一百多个 person, 但同框
          # 还有几十辆车和摩托 —— 那是逛街的人流, 不是聚集。实测抽样中 123 人 + 8 车、
          # 42 人 + 6 摩托 都被判成了"人员聚集", 属于错标。
          # 判据: 同框的车辆类目标超过 traffic_veto_count 就否决, 并转为困难负样本 ——
          # "街上很多人但不是集结"恰恰是最该有的那类负样本。
          traffic_veto_classes: ["vehicle", "car", "motorcycle", "motor", "bicycle",
                                 "bus", "van", "truck", "large-vehicle"]
          traffic_veto_count: 5
          min_cluster_size: 20
          eps_ratio: 0.04
          eps_obj_mult: 3.0        # 邻域半径下限 = 3 倍目标尺寸, 使判定不随裁剪尺寸漂移
          # v0.5.4 新增两条, **都是自由看图逼出来的**。
          # DroneCrowd 那几张标注有 158/175 个人头, 模型的原话却是
          # 「呈散点状分布，并非密集拥挤」「人群非常稀疏」—— 人是散在整个广场上的。
          #
          # 根因是单链接聚类的链式效应: 纯 union-find 等价于 DBSCAN 的 minPts=1,
          # 一广场零散行人只要首尾相接就串成一个大簇。实测 1920x1080 里 158 人
          # 均匀散布(绝非聚集)照样聚出 20 人的簇, 刚好撞上 min_cluster_size。
          #   min_core_neighbors  = DBSCAN 的 minPts, 只有核心点能连通两团
          #   max_area_per_object = 簇要够密: 每个目标平均占的簇面积 / 目标面积
          # 后者的门槛是量出来的: 均匀散布 27~32 倍, 真聚集 5.4~16.5 倍。
          # (最近邻距离试过, 两者 1.4~3.3 完全重叠, 没用。)
          min_core_neighbors: 3
          max_area_per_object: 20
          # 补量用的放宽档。只在该类产量不够时由 derive_events --relax-below 启用,
          # 命中的事件打 relaxed 标记, 答案改用"小规模聚集"这类留有余地的说法,
          # 不会拿放宽出来的样本去冒充典型集结。
          relax:
            min_cluster_size: 12
            eps_ratio: 0.055
            eps_obj_mult: 3.5
      # 装备: 必须含军事目标。纯民用车辆聚集(停车场/卡车场)是最大错标源,
      # 命中规模但不含军事目标者标为 hard_negative, 作为困难负样本
      - name: equipment
        zh: 装备集结
        rule:
          kind: density_cluster
          target_classes: ["vehicle", "large-vehicle", "truck", "car", "tank",
                           "military-vehicle", "military-truck", "armored",
                           "civil-plane", "military-plane", "civil-helicopter",
                           "military-helicopter", "ship", "warship"]
          # 阈值按军事装备的规模定, 不按民用停车场。MAR20 平均 5.8 架/图,
          # 取 8 会滤掉约六成图; 5 件军事装备集中停放已构成集结。
          # 民用目标由 require_any 排除, 不靠数量阈值把关。
          min_cluster_size: 5
          eps_ratio: 0.06
          eps_obj_mult: 3.0        # 同上; DOTA 切片后图像变小, 只按对角线取会漏判
          # 装备类目标大、间距相对身长小(停机坪上飞机间距约 2-3 倍机身),
          # 所以密度门槛可以比人员松, 核心点要求也低一档(装备本来就少)。
          min_core_neighbors: 2
          max_area_per_object: 12
          relax:
            min_cluster_size: 3    # 3 件军事装备集中停放, 只能说"小规模集结迹象"
            eps_ratio: 0.08
            eps_obj_mult: 4.0
          # 军用与民用必须分开命名。MAR20 的飞机全是军机, DOTA 的 plane 含民航客机;
          # 若都叫 plane, 民用机场停机坪会被判成装备集结。同理 DOTA 的 ship
          # 多为民用港口, 只有 warship 才计入。
          require_any: ["tank", "military-vehicle", "military-truck", "armored",
                        "military-plane", "military-helicopter", "warship"]
          on_require_fail: hard_negative

  - id: explosion
    zh: 爆炸/火光
    enabled: true
    cues: ["强亮斑与火球", "扬尘与碎片扩散", "瞬时高对比亮区"]
    rule: {kind: label_transfer, from_labels: ["Explosion", "fire", "Arson", "Riot"]}

  - id: smoke
    zh: 烟雾
    enabled: true
    cues: ["烟柱", "灰白扩散团", "烟幕遮蔽地表"]
    rule: {kind: label_transfer, from_labels: ["smoke", "Smoke", "fire"]}

  # ── v0.5.0 停用。停用理由(不是数据不够, 是这一类本身立不住):
  #   1. 越界是"轨迹与边界的关系", 单帧里看不见 —— 运动看不见, 边界更看不见;
  #   2. 那条边界是我们自己画的虚拟线, 图上根本不存在。把它写进问题(「设有一条
  #      近似垂直纵贯画面的虚拟警戒线」), 等于用自然语言往图里注入一个不存在的
  #      几何前提, 再要模型在脑子里画出来判断相交 —— 这是在教模型顺着话编。
  #   3. 数据也只有 VisDrone-MOT 一个来源, 且人工核对困难。
  # 要恢复的话, 正确做法是把警戒线**真的画到图上**(半透明红线), 让它变成纯视觉题,
  # 和真实电子围栏一致; 而不是用文字描述一条看不见的线。
  - id: border_crossing
    zh: 越界移动
    enabled: false
    cues: ["目标轨迹跨越边界线", "进入禁入区域", "由界外向界内移动"]
    rule:
      kind: boundary_cross
      target_classes: ["person", "vehicle", "soldier", "truck"]
      min_displacement_ratio: 0.02   # 相对图像对角线的最小位移, 过滤抖动
      # 越界只有 VisDrone-MOT 一个来源, 是四类里最紧的一类, 放宽档必然用得上:
      # 位移门槛减半 + 允许更多类目标越界。
      relax:
        min_displacement_ratio: 0.01
        target_classes: ["person", "vehicle", "soldier", "truck", "car", "van",
                         "bus", "motor", "pedestrian", "people"]

  - id: disaster
    zh: 灾害现场
    enabled: false
    # v0.5.1 停用。**理由不是规则不成立，是没有数据。**
    # 全库扫下来 disaster 事件数为 0：能贡献这一类的只有 ERA 的
    # flood/landslide/mudslide/post_earthquake/traffic_collision 几个标签，
    # 而 ERA 全库只有 2173 条（且 video 与 SingleFrames 是同一批，不能算两次），
    # 落到这五个标签上所剩无几。公开数据里合适的源（FloodNet / RescueNet /
    # xBD）都需要另外下载，本轮不引入。
    # 规则和 prompt 都原样留着：哪天补上数据源，把 enabled 改回 true 即可，
    # 不必重写。
    #
    # 以下为原始设计说明（仍然有效）：
    # ERA 的 flood / landslide / mudslide / post_earthquake /
    # traffic_collision 原本被整个排除, 理由是"画面常含烟尘火光, 既不能当异常
    # 也不能当正常"。但那个理由只在它们**没有自己的类别**时成立 —— 单列一类,
    # 歧义就消失了: 它们不再是"说不清算不算异常", 而是明确的第五类。
    # 顺带救回上一轮被丢掉的那 691 段视频。
    #
    # 这一类是航拍异常检测里最好判的: 洪水、滑坡、废墟在俯视角下极其显著,
    # 单帧就能判, 不需要任何外部前提。
    cues: ["大面积水体漫过原有地表", "山体垮塌与泥流痕迹", "建筑成片倒塌",
           "道路中断或被掩埋", "车辆异常聚集于事故点"]
    subtypes:
      - {name: flood, zh: 洪涝}
      - {name: landslide, zh: 滑坡泥石流}
      - {name: collapse, zh: 建筑垮塌}
      - {name: collision, zh: 交通事故}
    rule: {kind: label_transfer,
           from_labels: ["flood", "landslide", "mudslide", "post_earthquake",
                         "traffic_collision"]}

  # ---------------------------------------------------------------- 已停用
  # 恢复方式: enabled 改 true。但请先确认数据量能支撑 25,000 条 QA(约 2,800 张图)。

  - id: fortification
    zh: 阵地/工事构筑
    enabled: false
    # 停用原因: ERA constructing 抽帧去重后仅约 300 张可用图, 差 9 倍;
    # 公开数据中掩体/壕沟/火炮阵地影像基本为零; 判定本质需要同一地点的
    # 多时相对比, 而现有数据源全为单时相。需真实内部影像或 ARMA3 合成才可开启。
    cues: ["新增土方与壕沟", "掩体轮廓", "工程机械作业"]
    rule: {kind: label_transfer, from_labels: ["constructing", "excavator"]}

  - id: convoy
    zh: 车队机动
    enabled: true
    # v0.5.0 启用。当初停用的理由是"与正常道路交通无法可靠区分" —— 那是因为
    # 判据只有"共线 + 数量", 而正常车流同样共线。补上三条才分得开:
    #   间距均匀(车队保队形, 车流忽快忽慢)、车型一致(车队同型, 车流混杂)、
    #   细长(车队是一条, 停车场是一片)。实测: 军卡车队命中, 混杂车流与停车场式
    #   排布都不命中。
    cues: ["车辆沿道路线性排列", "间距均匀", "同型同向", "队列细长"]
    rule:
      kind: linear_formation
      target_classes: ["military-truck", "military-vehicle", "armored", "tank",
                       "truck", "large-vehicle", "vehicle"]
      min_count: 5
      collinearity_r2: 0.92
      max_spacing_cv: 0.45        # 间距变异系数上限 —— 超过就是车流不是车队
      # v0.5.3 新增, **改用"找共线子集"之后必须有这一条**。
      # 旧算法要求全图所有车共线，候选本来就已经是车队了；现在从满图散车里搜
      # 共线子集，搜索空间大了几个量级，光靠 CV 挡不住：实测 40 辆随机散车凑出
      # 的最好一条线 CV 能低到 0.077，比带抖动的真车队（中位 0.156）还整齐。
      # 真正分得开的是平均间距相对车身长度 —— 真车队最大 4.0 倍，随机凑线最小
      # 5.8 倍。取 5.0 卡在中间。高速上拉得开的车队可能被误杀，那是有意的取舍：
      # 宁可漏，不许把散车编成车队。
      max_gap_obj_mult: 3.5
      # **这一条是精度的最后一道闸, 不要放宽。**
      # 实测: 15 辆随机散车就能凑出间距 1.49 车长的"整齐队列", 而最紧的真车队
      # 九成分位才 1.63；80 辆以上时随机线能压到 0.8 车长，比任何真车队都紧。
      # 也就是说靠几何量分不开车队和密集车流 —— 停车场的一排车本身就是共线+
      # 等距+细长。唯一还站得住的信号是"画面里的车基本都在这一列上"。
      # 结果是 convoy 注定低产。想多捞就得接受假车队，那与第一条要求冲突。
      min_inlier_ratio: 0.6
      band_obj_mult: 1.5          # RANSAC 内点带宽 = 车身的几倍
      max_lines: 3                # 一张图最多找几支车队
      max_candidates: 40          # 每轮考察多少条候选线
      min_elongation: 4.0         # 主轴跨度 / 垂直跨度 —— 低于这个是一片, 属集结
      min_same_class_ratio: 0.7   # 同型占比 —— 低于这个是混杂车流
      # v0.5.2: **去掉 require_any 的军事目标约束。**
      # 原来要求簇里必须含 military-truck/military-vehicle/armored/tank，
      # 结果全库产量为 0 —— 只有 Mendeley 有 tank，而它每图目标中位数是 1、
      # 九成分位才 5，640x640 的裁剪图凑不出五辆共线坦克。
      #
      # 撤掉这条的依据是：**"车队机动"本身并不必然是军用**，而且把民用车流
      # 排除掉的活儿，上面四条判据已经干完了 —— 造了七种对照场景实测：
      #   坦克列 / 军卡列          -> 命中
      #   混杂车流(车型杂)          -> 不命中
      #   间距忽大忽小(走走停停)     -> 不命中
      #   停车场式一片(不细长)       -> 归 massing 而非 convoy
      #   只有四辆(低于 min_count)   -> 不命中
      # 也就是说 require_any 在这里是**第五道**约束，不是唯一那道。
      #
      # 代价说清楚：民用卡车车队现在会判成 convoy。这是有意的 —— 训练目标是
      # "认出成队行进的车列"，至于是不是军用，交给 military_grade 这个证据字段
      # 和描述题去表达，而不是在事件层面一刀切掉。
      # 要退回旧行为：把下面两行取消注释即可。
      # require_any: ["military-truck", "military-vehicle", "armored", "tank"]
      # on_require_fail: hard_negative
      military_classes: ["military-truck", "military-vehicle", "armored", "tank",
                         "military-plane", "military-helicopter", "warship"]
      relax:
        min_count: 4
        collinearity_r2: 0.88
        max_spacing_cv: 0.55

  - id: naval_massing
    zh: 舰船集结
    enabled: false
    # 停用原因: DOTA/FAIR1M 的 ship 绝大多数是民用港口, 错标风险高。
    # 军用舰船集结已并入 massing/equipment 的 require_any(warship)。
    cues: ["港口舰船密集停泊", "海上编队航行"]
    rule:
      kind: density_cluster
      target_classes: ["ship", "vessel", "maritime-vessel", "warship"]
      min_cluster_size: 6
      eps_ratio: 0.08

  - id: air_activity
    zh: 航空活动异常
    enabled: false
    # 停用原因: 与 massing/equipment 重叠, 机群集结已由后者覆盖。
    cues: ["停机坪飞机数量异常", "直升机起降", "机群列队"]
    rule:
      kind: density_cluster
      target_classes: ["plane", "helicopter", "aircraft", "fixed-wing-aircraft"]
      min_cluster_size: 6
      eps_ratio: 0.10
