# LLaMA-Factory 训练配置示例: Qwen2.5-VL-7B + LoRA
# 用法: llamafactory-cli train configs/qwen2_5vl_lora_sft.yaml
# 注意: dataset_dir 指向本仓库的 data/ 目录(其中含 dataset_info.json)

### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_target: all
freeze_vision_tower: true      # 数据量 <10 万条时冻结视觉塔更稳; 数据充足可放开

### dataset
dataset: military_anomaly_vqa
eval_dataset: military_anomaly_vqa_val
dataset_dir: data
template: qwen2_vl
cutoff_len: 2048
image_max_pixels: 1048576      # 航拍图小目标多, 分辨率别压太狠
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: saves/qwen2_5vl-7b/lora/military-anomaly
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 500
